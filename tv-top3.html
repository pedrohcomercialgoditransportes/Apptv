<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GODI · Top 3 do Dia</title>
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { height: 100%; overflow: hidden; }
  body { padding: 16px 28px; display: flex; flex-direction: column; gap: 12px; }

  /* ---------- header (mesmo padrão do painel principal) ---------- */
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 20px;
  }
  header.top .brand { display: flex; align-items: center; gap: 12px; }
  header.top img { height: 34px; display: block; }
  header.top img.hidden { display: none; }
  header.top img.hidden + .fallback { display: flex; }
  header.top .fallback { display: none; }
  header.top .godi-logo-wordmark, header.top .godi-logo-wordmark span { color: #06222b; }

  .clock-chip {
    display: flex; align-items: center; gap: 9px;
    background: #08202C; border-radius: 12px; padding: 6px 15px 6px 13px;
  }
  .clock-chip .clock-icon { flex-shrink: 0; display: block; }

  .the-process-badge {
    width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
    border: 2px solid #08202C; box-shadow: 0 0 0 2px rgba(0,168,118,0.35);
    display: block; flex-shrink: 0;
  }
  .clock-block { text-align: right; }
  .clock-block .hora {
    font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; color: #ffffff; letter-spacing: 0.5px;
  }
  .clock-block .data {
    font-size: 9.5px; color: var(--godi-cyan-bright); margin-top: 3px; text-transform: capitalize; font-weight: 600;
  }

  .live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: #06222b;
    display: inline-block; margin-right: 6px; box-shadow: 0 0 6px var(--godi-mint-bright);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .live-label { font-size: 10px; color: rgba(6,34,43,0.55); font-weight: 700; letter-spacing: 1px; }

  /* ---------- cartões: fundo claro (mesmo padrão do formulário) ---------- */
  .godi-panel { background: var(--godi-gradient); border: none; }

  /* ---------- cronômetro (metade do espaço, bem grande) ---------- */
  .cronometro-card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; min-height: 0; gap: 4px; padding: 10px;
  }
  .crono-icon { width: 34px; height: 34px; color: #054957; margin-bottom: 4px; }
  .crono-hora {
    font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 108px; line-height: 1;
    color: #06222b; font-variant-numeric: tabular-nums; letter-spacing: 2px;
  }
  .crono-data {
    font-size: 22px; font-weight: 700; color: #054957; text-transform: capitalize; margin-top: 6px;
  }

  /* ---------- blocos de ligação (agenda do dia, em destaque) ---------- */
  .bloco-ligacao-grande {
    display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0;
    padding: 16px 30px; justify-content: center;
  }
  .blg-header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
  }
  .blg-title {
    font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.3px;
    display: flex; align-items: center; gap: 10px; color: #06222b;
  }
  .blg-title .ico { width: 22px; height: 22px; color: #054957; flex-shrink: 0; }
  .blg-stats { display: flex; gap: 34px; }
  .blg-stat { text-align: right; }
  .blg-stat-valor {
    font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums;
    line-height: 1; color: #06222b;
  }
  .blg-stat-label {
    font-size: 9.5px; font-weight: 800; letter-spacing: 0.8px; color: rgba(6,34,43,0.6);
    text-transform: uppercase; margin-top: 4px;
  }

  .blg-periodos { display: flex; flex-direction: column; gap: 10px; flex: 1; justify-content: center; }
  .blg-periodo-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .blg-periodo-titulo {
    font-size: 13px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
    color: #054957; flex-shrink: 0; min-width: 98px; display: flex; align-items: center; gap: 7px;
  }
  .blg-periodo-titulo .ico { width: 17px; height: 17px; }
  .blg-lista { display: flex; align-items: center; justify-content: center; gap: 12px; flex: 1; }
  .blg-bloco {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px; border-radius: 14px; border: none;
    background: #08202C; cursor: pointer; user-select: none;
    transition: box-shadow 0.15s ease, background 0.15s ease;
  }
  .blg-bloco:hover { box-shadow: 0 0 0 2px var(--godi-cyan-bright); }
  .blg-bloco .blg-hora {
    font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap;
    color: #fff;
  }
  .blg-bloco .blg-check {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .blg-bloco .blg-check svg { width: 14px; height: 14px; opacity: 0; }
  .blg-bloco.is-now { box-shadow: 0 0 0 3px var(--godi-mint); }
  .blg-bloco.is-now .blg-hora { color: var(--godi-mint); }
  .blg-bloco.is-done { box-shadow: 0 0 0 2px rgba(2,197,219,0.55); }
  .blg-bloco.is-done .blg-hora { color: rgba(255,255,255,0.5); text-decoration: line-through; }
  .blg-bloco.is-done .blg-check { background: var(--godi-gradient); border-color: transparent; }
  .blg-bloco.is-done .blg-check svg { opacity: 1; }

  /* ---------- título da página ---------- */
  .page-title {
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 10px;
  }
  .page-title h1 {
    font-family: 'Montserrat', sans-serif; font-size: 25px; font-weight: 900; margin: 0;
    letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px; color: #fff;
  }
  .page-title h1 .trophy { width: 26px; height: 26px; color: var(--godi-gold); }
  .page-title .sub {
    font-size: 12px; color: rgba(255,255,255,0.65); font-weight: 700; letter-spacing: 0.3px;
  }

  /* ---------- grid de 5 pódios ---------- */
  .top3-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; flex-shrink: 0; }
  .top3-card { display: flex; flex-direction: column; align-items: center; padding: 18px 10px 16px; gap: 18px; }

  .cat-label { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
  .cat-label .cat-icon-wrap {
    width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: #08202C; border: none; color: var(--godi-mint);
    flex-shrink: 0;
  }
  .cat-label .cat-icon-wrap .ico { width: 25px; height: 25px; }
  .cat-label .cat-titulo {
    font-size: 17px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;
    color: #06222b; text-align: center; line-height: 1.25;
  }
  .cat-label .cat-total {
    font-size: 14px; font-weight: 800; color: var(--godi-mint);
    background: #08202C; padding: 2px 12px; border-radius: 999px;
  }

  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; width: 100%; flex-shrink: 0; }
  .podium-slot { display: flex; flex-direction: column; align-items: center; width: 32%; min-width: 0; }
  .podium-slot .crown { width: 26px; height: 26px; margin-bottom: 4px; color: var(--godi-gold); flex-shrink: 0; }
  .podium-slot .crown.oculto { visibility: hidden; }

  .podium-avatar-wrap { position: relative; margin-bottom: 10px; flex-shrink: 0; }
  .podium-avatar, .podium-avatar-fallback {
    border-radius: 50%; object-fit: cover; display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-family: 'Montserrat', sans-serif; background: #08202C; color: #fff;
  }
  .podium-slot.first .podium-avatar, .podium-slot.first .podium-avatar-fallback {
    width: 100px; height: 100px; border: 4px solid var(--godi-gold); font-size: 25px;
    box-shadow: 0 0 0 5px rgba(255,209,102,0.16), 0 12px 22px rgba(0,0,0,0.35);
  }
  .podium-slot.second .podium-avatar, .podium-slot.second .podium-avatar-fallback {
    width: 76px; height: 76px; border: 3px solid var(--godi-silver); font-size: 18px;
    box-shadow: 0 0 0 4px rgba(215,224,234,0.14);
  }
  .podium-slot.third .podium-avatar, .podium-slot.third .podium-avatar-fallback {
    width: 68px; height: 68px; border: 3px solid var(--godi-bronze); font-size: 16px;
    box-shadow: 0 0 0 4px rgba(231,164,105,0.14);
  }
  .podium-medal {
    position: absolute; bottom: -3px; right: -3px; width: 27px; height: 27px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13.5px;
    border: 2px solid #0A2530; font-family: 'Montserrat', sans-serif;
  }
  .podium-slot.first .podium-medal { background: var(--godi-gold); color: #3A2A00; }
  .podium-slot.second .podium-medal { background: var(--godi-silver); color: #2A2F36; }
  .podium-slot.third .podium-medal { background: var(--godi-bronze); color: #3A2000; }

  .podium-nome {
    font-weight: 800; font-size: 17px; text-align: center; white-space: normal; line-height: 1.15;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    max-width: 100%; margin-bottom: 4px; padding: 0 2px; min-height: 2.3em; color: #06222b;
  }
  .podium-slot.second .podium-nome, .podium-slot.third .podium-nome {
    font-size: 14px;
  }
  .podium-valor {
    font-family: 'Montserrat', sans-serif; font-weight: 900; margin-bottom: 10px; white-space: nowrap;
    background: #08202C; border-radius: 999px;
  }
  .podium-slot.first .podium-valor { font-size: 20px; color: var(--godi-mint); padding: 3px 14px; }
  .podium-slot.second .podium-valor { font-size: 15px; color: var(--godi-cyan-bright); padding: 2px 12px; }
  .podium-slot.third .podium-valor { font-size: 14px; color: var(--godi-cyan-bright); padding: 2px 12px; }

  .podium-block {
    width: 100%; border-radius: 10px 10px 0 0; display: flex; align-items: flex-start; justify-content: center;
    padding-top: 8px; font-family: 'Montserrat', sans-serif; font-weight: 900; color: #08202C; flex-shrink: 0;
  }
  .podium-slot.first .podium-block { height: 110px; background: linear-gradient(180deg, #FFE9B8 0%, var(--godi-gold) 100%); font-size: 30px; }
  .podium-slot.second .podium-block { height: 78px; background: linear-gradient(180deg, #F1F5F9 0%, var(--godi-silver) 100%); font-size: 26px; }
  .podium-slot.third .podium-block { height: 56px; background: linear-gradient(180deg, #F5D3AE 0%, var(--godi-bronze) 100%); font-size: 23px; }

  .top3-vazio {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: rgba(6,34,43,0.55); font-size: 12px; font-weight: 700; text-align: center; padding: 0 8px;
  }

  @media (max-width: 1100px) {
    .top3-grid { grid-template-columns: repeat(2, 1fr); }
    body { overflow: auto; height: auto; }
  }

  /* Celular / janela bem estreita: empilha tudo em coluna única, sem cortar nada. */
  @media (max-width: 700px) {
    header.top { flex-wrap: wrap; row-gap: 8px; padding: 10px 12px; }
    .cronometro-card { flex: none; padding: 14px 8px; }
    .crono-hora { font-size: 54px; letter-spacing: 1px; }
    .crono-data { font-size: 15px; }
    .bloco-ligacao-grande { flex: none; padding: 12px 14px; }
    .blg-header { row-gap: 8px; }
    .blg-stats { gap: 16px; }
    .blg-periodo-row { row-gap: 8px; }
    .blg-periodo-titulo { min-width: auto; }
    .blg-lista { flex-wrap: wrap; justify-content: flex-start; }
    .page-title h1 { font-size: 18px; }
    .top3-grid { grid-template-columns: 1fr; gap: 16px; }
    .top3-card { padding-bottom: 20px; }
  }
</style>
</head>
<body>

  <header class="top card godi-panel">
    <div class="brand">
      <img src="assets/logo.png" alt="GODI Transportes" onerror="this.classList.add('hidden')" />
      <div class="fallback">
        <div class="godi-logo-wordmark">GODI<span>TRANSPORTES</span></div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div><span class="live-dot"></span><span class="live-label" id="liveLabel">ATUALIZANDO</span></div>
      <img class="the-process-badge" src="assets/the-process.jpg" alt="THE PROCESS" />
    </div>
  </header>

  <section class="card godi-panel cronometro-card">
    <svg class="crono-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 7v5l3.5 2"/>
    </svg>
    <div class="crono-hora" id="cronoHora">--:--:--</div>
    <div class="crono-data" id="cronoData">—</div>
  </section>

  <section class="card godi-panel bloco-ligacao-grande">
    <div class="blg-header">
      <div class="blg-title">
        <svg class="ico" viewBox="0 0 24 24"><path d="M3 5.5C3 4 4 3 5.5 3h1.8c.5 0 .9.3 1 .8l1 3.3c.1.4 0 .8-.3 1.1L7.6 9.6c1 2.3 2.8 4.1 5.1 5.1l1.4-1.4c.3-.3.7-.4 1.1-.3l3.3 1c.5.1.8.5.8 1v1.8c0 1.5-1 2.5-2.5 2.5C9.9 21.5 2.5 14.1 3 5.5Z"/></svg>
        Blocos de Ligação — Agenda do Dia
      </div>
      <div class="blg-stats">
        <div class="blg-stat">
          <div class="blg-stat-valor"><span id="blgDoneCount">0</span>/<span id="blgTotalCount">0</span></div>
          <div class="blg-stat-label">Concluídos</div>
        </div>
        <div class="blg-stat">
          <div class="blg-stat-valor godi-gradient-text" id="blgAgora">—</div>
          <div class="blg-stat-label">Bloco Atual</div>
        </div>
        <div class="blg-stat">
          <div class="blg-stat-valor" id="blgTempoTotal">0h00</div>
          <div class="blg-stat-label">Tempo Total em Ligação</div>
        </div>
      </div>
    </div>
    <div class="blg-periodos">
      <div class="blg-periodo-row">
        <span class="blg-periodo-titulo"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg> Manhã</span>
        <span id="blgManha" class="blg-lista"></span>
      </div>
      <div class="blg-periodo-row">
        <span class="blg-periodo-titulo"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><path d="M4.5 18a3.5 3.5 0 0 1 .4-7 5 5 0 0 1 9.6-1.5A4 4 0 0 1 19 17.9v.1H4.5Z"/></svg> Tarde</span>
        <span id="blgTarde" class="blg-lista"></span>
      </div>
    </div>
  </section>

  <div class="page-title">
    <h1>
      <svg class="trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"/>
        <path d="M7 5H4v1a4 4 0 0 0 4 4"/>
        <path d="M17 5h3v1a4 4 0 0 1-4 4"/>
        <path d="M12 13v3"/>
        <path d="M8.5 20.5h7"/>
        <path d="M9.5 16.5h5l1 4h-7l1-4Z"/>
      </svg>
      TOP 3 DO DIA
    </h1>
    <div class="sub">Pódio em tempo real — os destaques de hoje da equipe GODI</div>
  </div>

  <section class="top3-grid">
    <div class="card godi-panel top3-card">
      <div class="cat-label">
        <div class="cat-icon-wrap"><svg class="ico" viewBox="0 0 24 24"><path d="M3 5.5C3 4 4 3 5.5 3h1.8c.5 0 .9.3 1 .8l1 3.3c.1.4 0 .8-.3 1.1L7.6 9.6c1 2.3 2.8 4.1 5.1 5.1l1.4-1.4c.3-.3.7-.4 1.1-.3l3.3 1c.5.1.8.5.8 1v1.8c0 1.5-1 2.5-2.5 2.5C9.9 21.5 2.5 14.1 3 5.5Z"/></svg></div>
        <div class="cat-titulo">Ligações no Dia</div>
        <div class="cat-total" id="totalLigacoes"></div>
      </div>
      <div class="podium" id="podioLigacoes"></div>
    </div>

    <div class="card godi-panel top3-card">
      <div class="cat-label">
        <div class="cat-icon-wrap"><svg class="ico" viewBox="0 0 24 24"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18.5" r="1.6"/><circle cx="17.5" cy="18.5" r="1.6"/></svg></div>
        <div class="cat-titulo">Quantidade de Cargas</div>
        <div class="cat-total" id="totalCargas"></div>
      </div>
      <div class="podium" id="podioCargas"></div>
    </div>

    <div class="card godi-panel top3-card">
      <div class="cat-label">
        <div class="cat-icon-wrap"><svg class="ico" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg></div>
        <div class="cat-titulo">Faturamento</div>
        <div class="cat-total" id="totalFaturamento"></div>
      </div>
      <div class="podium" id="podioFaturamento"></div>
    </div>

    <div class="card godi-panel top3-card">
      <div class="cat-label">
        <div class="cat-icon-wrap"><svg class="ico" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3 2.5-5 6-5s6 2 6 5"/><path d="M10 20c0-3 2.5-5 6-5s6 2 6 5"/></svg></div>
        <div class="cat-titulo">Reuniões</div>
        <div class="cat-total" id="totalReunioes"></div>
      </div>
      <div class="podium" id="podioReunioes"></div>
    </div>

    <div class="card godi-panel top3-card">
      <div class="cat-label">
        <div class="cat-icon-wrap"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M18 8v6M15 11h6"/></svg></div>
        <div class="cat-titulo">Clientes Novos</div>
        <div class="cat-total" id="totalClientesNovos"></div>
      </div>
      <div class="podium" id="podioClientesNovos"></div>
    </div>
  </section>

<script src="config.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);

  function fmtMoeda(v) {
    return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  }
  function fmtMoedaCompacta(v) {
    const n = Number(v) || 0;
    if (n >= 1000) return 'R$ ' + (n / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 'k';
    return fmtMoeda(n);
  }

  const AVATAR_MAP = {
    'Pedro Augusto': 'pedro-h',
    'Rodrigo Albino': 'rodrigo-a',
    'Natha Carlos': 'natha',
    'Bruno Renato': 'bruno-r',
    'Rafael Almeida': 'rafael-a',
    'Nemir Prado': 'prado',
    'Genesio Teixeira': 'genesio',
    'Jonathan Almeida': 'jonatham-a',
    'Ramon Felipe': 'ramon'
  };
  function avatarUrl(nome) {
    const arquivo = AVATAR_MAP[nome];
    return arquivo ? `assets/avatars/${arquivo}.png` : null;
  }
  function iniciaisDe(nome) {
    const partes = String(nome || '').trim().split(/\s+/).filter(Boolean);
    if (!partes.length) return '?';
    const primeira = partes[0].charAt(0);
    const ultima = partes.length > 1 ? partes[partes.length - 1].charAt(0) : '';
    return (primeira + ultima).toUpperCase();
  }
  window.onPodiumAvatarError = function (imgEl, nome) {
    const fallback = document.createElement('div');
    fallback.className = 'podium-avatar-fallback';
    fallback.textContent = iniciaisDe(nome);
    imgEl.replaceWith(fallback);
  };
  function avatarHtml(nome) {
    const url = avatarUrl(nome);
    return url
      ? `<img class="podium-avatar" src="${url}" alt="${nome}" onerror="onPodiumAvatarError(this, '${nome.replace(/'/g, "")}')" />`
      : `<div class="podium-avatar-fallback">${iniciaisDe(nome)}</div>`;
  }

  function atualizarRelogio() {
    const agora = new Date();
    const TZ = 'America/Sao_Paulo';
    $('cronoHora').textContent = agora.toLocaleTimeString('pt-BR', { timeZone: TZ });
    const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
    const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    const partes = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'long' }).formatToParts(agora);
    const get = (t) => partes.find(p => p.type === t).value;
    const diaSemanaMap = { Sunday: 0, Monday: 1, Tuesday: 2, Wednesday: 3, Thursday: 4, Friday: 5, Saturday: 6 };
    const diaIdx = diaSemanaMap[get('weekday')];
    $('cronoData').textContent = `${dias[diaIdx]}, ${parseInt(get('day'), 10)} de ${meses[parseInt(get('month'), 10) - 1]}`;
  }
  atualizarRelogio();
  setInterval(atualizarRelogio, 1000);

  // ordem visual do pódio: 2º à esquerda, 1º ao centro (mais alto), 3º à direita
  const ORDEM = ['second', 'first', 'third'];
  const CROWN_SVG = `<svg class="ico crown" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M3 17l1.6-8.6L9 12l3-6 3 6 4.4-3.6L21 17H3Z"/><path d="M3 19h18v1.6a.8.8 0 0 1-.8.8H3.8a.8.8 0 0 1-.8-.8V19Z" fill="currentColor"/></svg>`;

  function renderPodio(containerId, itens, formatarValor) {
    const el = $(containerId);
    const top3 = (itens || []).slice(0, 3);
    if (!top3.length) {
      el.innerHTML = '<div class="top3-vazio">Sem lançamentos ainda hoje</div>';
      return;
    }
    // garante 3 posições (preenche com vazio se faltar gente lançando)
    while (top3.length < 3) top3.push(null);

    el.innerHTML = ORDEM.map(posicao => {
      const idx = posicao === 'first' ? 0 : posicao === 'second' ? 1 : 2;
      const item = top3[idx];
      if (!item) {
        return `<div class="podium-slot ${posicao}">
          <svg class="crown oculto"></svg>
          <div class="podium-avatar-wrap"><div class="podium-avatar-fallback">—</div></div>
          <div class="podium-nome">—</div>
          <div class="podium-valor">—</div>
          <div class="podium-block">${idx + 1}º</div>
        </div>`;
      }
      return `<div class="podium-slot ${posicao}">
        ${posicao === 'first' ? CROWN_SVG : '<svg class="ico crown oculto"></svg>'}
        <div class="podium-avatar-wrap">
          ${avatarHtml(item.nome)}
          <div class="podium-medal">${idx + 1}</div>
        </div>
        <div class="podium-nome">${item.nome}</div>
        <div class="podium-valor">${formatarValor(item)}</div>
        <div class="podium-block">${idx + 1}º</div>
      </div>`;
    }).join('');
  }

  async function carregarDados() {
    if (!CONFIG.API_URL || CONFIG.API_URL.indexOf('COLE_AQUI') === 0) {
      $('liveLabel').textContent = 'CONFIGURE A API_URL';
      return;
    }
    try {
      const r = await fetch(`${CONFIG.API_URL}?action=dados`);
      const d = await r.json();

      renderPodio('podioLigacoes', d.ligacoesHoje, i => String(i.valor));
      renderPodio('podioCargas', d.cargasHoje, i => String(i.valor));
      renderPodio('podioClientesNovos', d.clientesNovosHoje, i => String(i.valor));
      renderPodio('podioReunioes', d.reunioesHoje, i => String(i.valor));
      renderPodio('podioFaturamento', d.faturamentoHojePorComercial, i => fmtMoedaCompacta(i.valor));

      $('totalLigacoes').textContent = (d.totalLigacoesHoje || 0) + ' no total';
      $('totalCargas').textContent = (d.totalCargasHoje || 0) + ' no total';
      $('totalClientesNovos').textContent = (d.totalClientesNovosHoje || 0) + ' no total';
      $('totalReunioes').textContent = (d.totalReunioesHoje || 0) + ' no total';
      $('totalFaturamento').textContent = fmtMoeda(d.totalFaturamentoHoje || 0) + ' no total';

      $('liveLabel').textContent = 'ATUALIZADO ' + new Date().toLocaleTimeString('pt-BR');
    } catch (e) {
      console.error(e);
      $('liveLabel').textContent = 'ERRO AO ATUALIZAR';
    }
  }

  carregarDados();
  setInterval(carregarDados, (CONFIG.ATUALIZAR_A_CADA_SEGUNDOS || 30) * 1000);

  // ---------- Blocos de Ligação (agenda do dia, horários fixos) ----------
  (function blocosLigacao() {
    function pad(n) { return String(n).padStart(2, '0'); }
    function toMin(h, m) { return h * 60 + m; }
    function fmtHora(mins) { return pad(Math.floor(mins / 60)) + ':' + pad(mins % 60); }

    const HORARIOS = (CONFIG.BLOCOS_LIGACAO) || {
      manha: [[9, 0, 10, 0], [10, 30, 11, 30]],
      tarde: [[13, 45, 14, 45], [15, 0, 16, 0], [16, 30, 17, 30]]
    };
    function paraFaixas(lista) {
      return lista.map(([h1, m1, h2, m2]) => ({ start: toMin(h1, m1), end: toMin(h2, m2) }));
    }
    const manha = paraFaixas(HORARIOS.manha);
    const tarde = paraFaixas(HORARIOS.tarde);
    const todos = manha.concat(tarde);
    const minutosTotais = todos.reduce((soma, b) => soma + (b.end - b.start), 0);

    // Hora atual e chave de armazenamento por dia (America/Sao_Paulo). Mesma chave do painel
    // principal, então marcar um bloco aqui reflete lá (e vice-versa).
    const agora = new Date();
    const dateKey = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(agora);
    const partesHora = new Intl.DateTimeFormat('en-GB', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(agora);
    const nowMin = toMin(
      parseInt(partesHora.find(p => p.type === 'hour').value, 10),
      parseInt(partesHora.find(p => p.type === 'minute').value, 10)
    );

    const CHAVE = 'godi_blocos_ligacao:' + dateKey;
    let done = {};
    try { done = JSON.parse(localStorage.getItem(CHAVE) || '{}'); } catch (e) { done = {}; }
    function persist() { try { localStorage.setItem(CHAVE, JSON.stringify(done)); } catch (e) {} }

    function atualizarStats() {
      const n = Object.keys(done).filter(k => done[k]).length;
      $('blgDoneCount').textContent = n;
      $('blgTotalCount').textContent = todos.length;
      const h = Math.floor(minutosTotais / 60), m = minutosTotais % 60;
      $('blgTempoTotal').textContent = `${h}h${pad(m)}`;
      const atual = todos.find(b => nowMin >= b.start && nowMin < b.end);
      $('blgAgora').textContent = atual ? fmtHora(atual.start) : '—';
    }

    function renderLista(containerId, blocos) {
      const el = $(containerId);
      el.innerHTML = '';
      blocos.forEach((bloco) => {
        const key = fmtHora(bloco.start);
        const isNow = nowMin >= bloco.start && nowMin < bloco.end;
        const isDone = !!done[key];

        const div = document.createElement('div');
        div.className = 'blg-bloco' + (isNow ? ' is-now' : '') + (isDone ? ' is-done' : '');
        div.title = isNow ? 'Em andamento' : (isDone ? 'Concluído' : 'Aguardando');
        div.innerHTML = `
          <span class="blg-hora">${fmtHora(bloco.start)}–${fmtHora(bloco.end)}</span>
          <span class="blg-check"><svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-6.5" stroke="${isDone ? 'var(--godi-on-gradient)' : 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        `;
        div.addEventListener('click', () => {
          done[key] = !done[key];
          persist();
          renderLista(containerId, blocos);
          atualizarStats();
        });
        el.appendChild(div);
      });
    }

    renderLista('blgManha', manha);
    renderLista('blgTarde', tarde);
    atualizarStats();
  })();
})();
</script>
</body>
</html>
