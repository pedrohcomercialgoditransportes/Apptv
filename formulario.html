<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GODI · Lançamento Diário</title>
<link rel="stylesheet" href="styles.css" />
<style>
  body { padding: 20px; color: #000; }
  .wrap { max-width: 720px; margin: 0 auto; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  header.top img { height: 40px; }
  header.top .fallback { display: none; }
  header.top img.hidden { display: none; }
  header.top img.hidden + .fallback { display: flex; }

  .subtitle { color: #000; font-size: 14px; margin-top: 2px; }

  .card { padding: 22px; margin-bottom: 16px; }
  .card h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;
    margin: 0 0 16px 0; font-weight: 800; color: #000;
  }

  label {
    display: block; font-size: 13px; font-weight: 600;
    color: #000; margin-bottom: 6px;
  }
  select, input[type="number"] {
    width: 100%; padding: 14px 16px; border-radius: var(--godi-radius-sm);
    border: none; background: #08202C;
    color: #fff; font-family: 'Montserrat', sans-serif; font-size: 16px;
    font-weight: 700;
  }
  select::placeholder, input::placeholder { color: #fff; font-weight: 700; opacity: 1; }
  select:focus, input:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(2,197,219,0.35);
  }
  select option { background: #08202C; color: #fff; }

  /* Padrão: card/quadrado maior no verde-claro do degradê, campo/quadrado onde digitamos ou selecionamos na cor mais escura do fundo */
  .godi-panel { background: var(--godi-gradient); border: none; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row-comercial { margin-bottom: 16px; }

  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    background: rgba(0,168,118,0.08); border: 1px solid rgba(0,168,118,0.25);
    color: var(--godi-mint); padding: 10px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px;
  }

  .blocos-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .blocos-grid label { text-align: center; font-size: 10.5px; }
  .blocos-grid input {
    text-align: center; padding: 12px 4px; font-size: 15px;
    background: #08202C; border: none;
    color: #fff; font-weight: 800;
  }
  .blocos-grid input::placeholder { color: #fff; font-weight: 700; opacity: 1; }
  .blocos-grid input:disabled {
    background: #08202C; opacity: 0.4;
    color: #fff; cursor: not-allowed;
  }
  .blocos-grid input.locked {
    background: #08202C; opacity: 1; border: none;
    color: #fff; font-weight: 800; cursor: default;
  }
  .bloco-slot { position: relative; }
  .bloco-lock-icon {
    position: absolute; top: -6px; right: -6px; font-size: 11px;
    background: var(--godi-card); border-radius: 50%; width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center; border: 1px solid var(--godi-border);
  }
  .periodo-label {
    font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
    margin: 14px 0 8px; color: #000;
  }
  .periodo-label:first-child { margin-top: 0; }
  .bloco-aviso {
    font-size: 12px; color: #fff; background: #08202C;
    border: none; border-radius: var(--godi-radius-sm);
    padding: 10px 14px; margin-bottom: 16px;
  }

  .total-horas {
    margin-top: 16px; padding: 14px 18px; border-radius: var(--godi-radius-sm);
    background: #08202C; display: flex; justify-content: space-between;
    align-items: center; font-weight: 700; color: #fff;
  }
  .total-horas span:last-child { font-size: 22px; color: #fff !important; }

  .grid3 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { margin-bottom: 14px; }
  .field-icon { font-size: 18px; margin-right: 6px; }

  .actions { display: flex; gap: 12px; margin-top: 8px; }
  .actions .godi-btn { flex: 1; text-align: center; }
  .actions .godi-btn, .actions .godi-btn-ghost { color: #000; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--godi-gradient); color: #000;
    padding: 14px 24px; border-radius: 999px; font-weight: 700; font-size: 14px;
    opacity: 0; transition: all 0.25s ease; pointer-events: none; box-shadow: var(--godi-shadow);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.erro { background: var(--godi-danger); color: #000; }

  .rascunho-aviso {
    font-size: 12px; color: #000; text-align: center; margin-top: 10px;
  }
  .godi-gradient-text { background: none; -webkit-background-clip: initial; background-clip: initial; color: #000; }

  /* Campos escuros: garantir letra branca em tudo que estiver dentro deles */
  select, select *, select option,
  input[type="number"],
  .blocos-grid input,
  .bloco-aviso,
  .total-horas, .total-horas * {
    color: #fff !important;
  }
  select::placeholder, input::placeholder { color: #fff !important; opacity: 1; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top card godi-panel">
    <div style="display:flex; align-items:center; gap:12px;">
      <img src="assets/logo.png" alt="GODI Transportes" onerror="this.classList.add('hidden')" />
      <div class="fallback">
        <div class="godi-logo-wordmark">GODI<span>TRANSPORTES</span></div>
      </div>
    </div>
    <div style="text-align:right;">
      <div class="godi-gradient-text" style="font-weight:800; font-size:15px;">Lançamento Diário</div>
      <div class="subtitle" id="dataHoje">—</div>
    </div>
  </header>

  <div class="card godi-panel card-quem-lanca">
    <h2>Quem está lançando</h2>
    <div class="row-comercial" style="margin-bottom:0;">
      <label for="comercial">Comercial</label>
      <select id="comercial" required>
        <option value="">Selecione seu nome</option>
      </select>
    </div>
  </div>

  <div class="card godi-panel">
    <h2>Blocos de Ligação Efetiva · Contatos por horário</h2>
          <div class="bloco-aviso">🔒 Agora contado automaticamente pelo sistema (Orchestror). Não precisa mais preencher aqui.</div>
    <div class="blocos-grid" id="blocosManha"></div>
    <div class="periodo-label">Tarde</div>
    <div class="blocos-grid" id="blocosTarde"></div>

    <div class="total-horas">
      <span>Total de ligações efetivas hoje</span>
      <span id="totalHoras" class="godi-gradient-text">0</span>
    </div>
  </div>

  <div class="card godi-panel">
    <h2>Resultados do dia</h2>
    <div class="grid3">
      <div class="field">
        <label><span class="field-icon"><svg class="ico" viewBox="0 0 24 24"><path d="M5 4h3l2 5-2.5 2a12 12 0 0 0 5.5 5.5l2-2.5 5 2v3a2 2 0 0 1-2 2C10.5 21 3 13.5 3 6a2 2 0 0 1 2-2Z"/></svg></span>Discagem</label>
        <input type="number" inputmode="numeric" min="0" id="discagem" placeholder="0" />
      </div>
      <div class="field">
        <label><span class="field-icon"><svg class="ico" viewBox="0 0 24 24"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18.5" r="1.6"/><circle cx="17.5" cy="18.5" r="1.6"/></svg></span>Cargas</label>
        <input type="number" inputmode="numeric" min="0" id="cargas" placeholder="0" />
      </div>
      <div class="field">
        <label><span class="field-icon"><svg class="ico" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg></span>Faturamento (R$)</label>
        <input type="number" inputmode="decimal" min="0" step="0.01" id="faturamento" placeholder="0,00" />
      </div>
      <div class="field">
        <label><span class="field-icon"><svg class="ico" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3 2.5-5 6-5s6 2 6 5"/><path d="M10 20c0-3 2.5-5 6-5s6 2 6 5"/></svg></span>Reuniões</label>
              <input type="number" inputmode="numeric" min="0" id="reunioes" placeholder="Automático" disabled title="Sincronizado automaticamente do Orchestror" />
      </div>
      <div class="field">
        <label><span class="field-icon"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M18 8v6M15 11h6"/></svg></span>Cliente novo</label>
        <input type="number" inputmode="numeric" min="0" id="clienteNovo" placeholder="0" />
      </div>
      <div class="field">
        <label><span class="field-icon"><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2.5" width="6" height="3" rx="1"/><path d="M8.5 11h7M8.5 14.5h7M8.5 18h4.5"/></svg></span>Cotações</label>
        <input type="number" inputmode="numeric" min="0" id="cotacoes" placeholder="0" />
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="godi-btn godi-btn-ghost" id="btnRascunho">Salvar rascunho</button>
    <button class="godi-btn godi-btn-primary" id="btnEnviar">Enviar resultado</button>
  </div>
  <div class="rascunho-aviso" id="rascunhoAviso"></div>

</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const CAMPOS_RESULTADOS = ['discagem', 'cotacoes', 'reunioes', 'faturamento', 'clienteNovo', 'cargas'];
  const CHAVE_RASCUNHO = 'godi_rascunho_v1';

  const COMERCIAIS_FALLBACK = [
    'Pedro Augusto', 'Rodrigo Albino', 'Natha Carlos', 'Bruno Renato',
    'Rafael Almeida', 'Nemir Prado', 'Genesio Teixeira', 'Jonathan Almeida',
    'Ramon Felipe'
  ];

  function formatarDataHoje() {
    const hoje = new Date();
    const TZ = 'America/Sao_Paulo';
    const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
    const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    const partes = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'long' }).formatToParts(hoje);
    const get = (t) => partes.find(p => p.type === t).value;
    const diaSemanaMap = { Sunday: 0, Monday: 1, Tuesday: 2, Wednesday: 3, Thursday: 4, Friday: 5, Saturday: 6 };
    const diaIdx = diaSemanaMap[get('weekday')];
    return `${dias[diaIdx]}, ${parseInt(get('day'), 10)} de ${meses[parseInt(get('month'), 10) - 1]}`;
  }
  $('dataHoje').textContent = formatarDataHoje();

  function preencherComerciais(lista) {
    const sel = $('comercial');
    const atual = sel.value;
    sel.innerHTML = '<option value="">Selecione seu nome</option>';
    lista.forEach(nome => {
      const opt = document.createElement('option');
      opt.value = nome; opt.textContent = nome;
      sel.appendChild(opt);
    });
    if (atual) sel.value = atual;
  }
  preencherComerciais(COMERCIAIS_FALLBACK);

  async function carregarConfig() {
    if (!CONFIG.API_URL || CONFIG.API_URL.indexOf('COLE_AQUI') === 0) return;
    try {
      const r = await fetch(`${CONFIG.API_URL}?action=config`);
      const j = await r.json();
      if (j.comerciais && j.comerciais.length) preencherComerciais(j.comerciais);
    } catch (e) {
      console.warn('Não foi possível carregar config:', e);
    }
  }
  carregarConfig();

  function mostrarToast(msg, erro) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (erro ? ' erro' : '');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ---------- Blocos de Ligação (mesmos horários fixos da TV) ----------
  const BlocosDiscagem = (function () {
    function pad(n) { return String(n).padStart(2, '0'); }
    function toMin(h, m) { return h * 60 + m; }
    function fmtHora(mins) { return pad(Math.floor(mins / 60)) + ':' + pad(mins % 60); }

    const HORARIOS = (window.CONFIG && CONFIG.BLOCOS_LIGACAO) || {
      manha: [[8, 45, 9, 15], [9, 45, 10, 15], [10, 45, 11, 15]],
      tarde: [[13, 45, 14, 15], [14, 45, 15, 15], [15, 45, 16, 15], [16, 45, 17, 15]]
    };
    function paraFaixas(lista) {
      return lista.map(([h1, m1, h2, m2]) => ({ start: toMin(h1, m1), end: toMin(h2, m2) }));
    }
    const manha = paraFaixas(HORARIOS.manha);
    const tarde = paraFaixas(HORARIOS.tarde);
    const todos = manha.concat(tarde);

    function agora() {
      const d = new Date();
      const dateKey = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
      const partes = new Intl.DateTimeFormat('en-GB', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(d);      
      const nowMin = toMin(
        parseInt(partes.find(p => p.type === 'hour').value, 10),
        parseInt(partes.find(p => p.type === 'minute').value, 10)
      );
      return { dateKey, nowMin };
    }

    let { dateKey, nowMin } = agora();
    const CHAVE = 'godi_blocos_discagem:' + dateKey;
    let estado = {};
    try { estado = JSON.parse(localStorage.getItem(CHAVE) || '{}'); } catch (e) { estado = {}; }
    function persist() { try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) {} }

    function total() {
      return todos.reduce((soma, b) => {
        const key = fmtHora(b.start);
        const v = estado[key] && typeof estado[key].valor === 'number' ? estado[key].valor : 0;
        return soma + v;
      }, 0);
    }

    function renderGrupo(containerId, blocos) {
      const el = $(containerId);
      el.innerHTML = '';
      el.style.gridTemplateColumns = `repeat(${blocos.length}, 1fr)`;
      blocos.forEach((b, i) => {
        const key = fmtHora(b.start);
        const salvo = estado[key];
        const liberado = false; // travado manualmente: blocos agora sao automaticos (Orchestror)
        const travado = !!(salvo && salvo.travado);

        const slot = document.createElement('div');
        slot.className = 'bloco-slot';

        const label = document.createElement('label');
        label.innerHTML = key + (liberado ? '' : ' <svg class="ico" style="width:.8em;height:.8em" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>');

        const input = document.createElement('input');
        input.type = 'number';
        input.inputMode = 'numeric';
        input.min = '0';
        input.placeholder = liberado ? '0' : 'às ' + key;
        if (salvo && typeof salvo.valor === 'number') input.value = salvo.valor;

        if (!liberado) {
          input.disabled = true;
        } else if (travado) {
          input.disabled = true;
          input.classList.add('locked');
        } else {
          input.addEventListener('blur', () => {
            if (input.value === '') return;
            estado[key] = { valor: Number(input.value) || 0, travado: true };
            persist();
            input.disabled = true;
            input.classList.add('locked');
            const icon = document.createElement('div');
            icon.className = 'bloco-lock-icon';
            icon.textContent = '✓';
            slot.appendChild(icon);
            atualizarTotal();
          });
          input.addEventListener('input', atualizarTotal);
        }

        if (travado) {
          const icon = document.createElement('div');
          icon.className = 'bloco-lock-icon';
          icon.textContent = '✓';
          slot.appendChild(icon);
        }

        slot.appendChild(label);
        slot.appendChild(input);
        el.appendChild(slot);
      });
    }

    function atualizarTotal() {
      let soma = 0;
      document.querySelectorAll('#blocosManha input, #blocosTarde input').forEach(inp => {
        soma += Number(inp.value) || 0;
      });
      $('totalHoras').textContent = soma;
    }

    function render() {
      ({ dateKey, nowMin } = agora());
      renderGrupo('blocosManha', manha);
      renderGrupo('blocosTarde', tarde);
      atualizarTotal();
    }

    render();
    setInterval(render, 30000);

    return {
      total,
      // Estado completo (todos os blocos travados até agora hoje) — usado só
      // pra exibir o total na tela e pro rascunho local. NÃO usar pra enviar
      // ao servidor: se o comercial clicar em "Enviar resultado" mais de uma
      // vez no mesmo dia, isso reenviaria de novo blocos que já tinham sido
      // enviados na vez anterior, e a planilha somaria em dobro.
      coletar: () => {
        const dados = {};
        todos.forEach((b, i) => { dados['bloco' + (i + 1)] = (estado[fmtHora(b.start)] && estado[fmtHora(b.start)].valor) || 0; });
        return dados;
      },
      // Só os blocos que ainda NÃO foram enviados ao servidor (os já enviados
      // em envios anteriores hoje entram como 0, pra não duplicar contagem).
      coletarParaEnvio: () => {
        const dados = {};
        todos.forEach((b, i) => {
          const key = fmtHora(b.start);
          const salvo = estado[key];
          dados['bloco' + (i + 1)] = (salvo && !salvo.enviado && typeof salvo.valor === 'number') ? salvo.valor : 0;
        });
        return dados;
      },
      // Marca os blocos travados como já enviados — chamar só depois de um
      // envio confirmado com sucesso pro servidor.
      marcarEnviados: () => {
        todos.forEach(b => {
          const key = fmtHora(b.start);
          if (estado[key]) estado[key].enviado = true;
        });
        persist();
      }
    };
  })();

  function coletarDados(paraEnvio) {
    const dados = { comercial: $('comercial').value };
    Object.assign(dados, paraEnvio ? BlocosDiscagem.coletarParaEnvio() : BlocosDiscagem.coletar());
    CAMPOS_RESULTADOS.forEach(id => dados[id] = Number($(id).value) || 0);
    return dados;
  }

  function preencherCampos(dados) {
    if (!dados) return;
    if (dados.comercial) $('comercial').value = dados.comercial;
    CAMPOS_RESULTADOS.forEach(id => {
      if (dados[id] !== undefined && dados[id] !== 0) $(id).value = dados[id];
    });
  }

  // Restaura rascunho salvo, se houver (apenas cotações/reuniões/cliente novo/faturamento —
  // os blocos de ligação já salvam e travam sozinhos, não fazem parte do rascunho manual).
  try {
    const salvo = JSON.parse(localStorage.getItem(CHAVE_RASCUNHO) || 'null');
    if (salvo) {
      preencherCampos(salvo);
      $('rascunhoAviso').textContent = 'Rascunho carregado de um lançamento não enviado.';
    }
  } catch (e) {}

  $('btnRascunho').addEventListener('click', () => {
    localStorage.setItem(CHAVE_RASCUNHO, JSON.stringify(coletarDados()));
    mostrarToast('Rascunho salvo neste dispositivo.');
  });

  $('btnEnviar').addEventListener('click', async () => {
    const dados = coletarDados(true);
    if (!dados.comercial) {
      mostrarToast('Selecione seu nome antes de enviar.', true);
      return;
    }
    if (!CONFIG.API_URL || CONFIG.API_URL.indexOf('COLE_AQUI') === 0) {
      mostrarToast('Configure a API_URL em config.js antes de enviar.', true);
      return;
    }
    const btn = $('btnEnviar');
    btn.disabled = true; btn.textContent = 'Enviando...';
    try {
      await fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight no Apps Script
        body: JSON.stringify(dados)
      });
      BlocosDiscagem.marcarEnviados();
      localStorage.removeItem(CHAVE_RASCUNHO);
      mostrarToast('Resultado enviado! Bom trabalho 🚀');
      CAMPOS_RESULTADOS.forEach(id => $(id).value = '');
      $('rascunhoAviso').textContent = '';
    } catch (e) {
      mostrarToast('Erro ao enviar. Tente novamente.', true);
    } finally {
      btn.disabled = false; btn.textContent = 'Enviar resultado';
    }
  });
})();
</script>
</body>
</html>
